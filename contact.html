    <main class="main-container">
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <h2 class="section-title">أرسل لي رسالة</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" placeholder="اكتب اسمك هنا..." required>
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label>الرسالة</label>
                    <textarea rows="5" placeholder="اكتب رسالتك..." required></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%;">إرسال الرسالة</button>
            </form>
        </div>
    </main>
